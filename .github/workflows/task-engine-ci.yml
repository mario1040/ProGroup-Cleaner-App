name: Task Engine CI

on:
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - "db/**"
      - "package.json"
      - "tsconfig.json"
      - "Dockerfile"
      - "docker-compose.naris.yml"
      - "nginx/**"
      - ".env.naris.example"
      - ".dockerignore"
      - ".github/workflows/task-engine-ci.yml"
  push:
    branches: [feat/postgres-task-engine]
    paths:
      - "server/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/task-engine-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: naris_ops
          POSTGRES_USER: naris_test
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U naris_test -d naris_ops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://naris_test:ci-only-password@localhost:5432/naris_ops
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Apply PostgreSQL migration
        run: npx tsx server/db/migrate.ts
      - name: Verify PostgreSQL schema
        run: npx tsx server/db/schema-smoke.ts
      - name: Run task-engine tests
        run: npx vitest run server
      - name: TypeScript check
        run: npm run lint
      - name: Frontend production build
        run: npm run build
      - name: Validate isolated Compose configuration
        run: |
          printf "%s\\n" "NARIS_DB_ADMIN_USER=naris_admin" "NARIS_DB_ADMIN_PASSWORD=ci_admin_0123456789abcdef0123456789abcdef0123456789abcdef" "NARIS_DB_USER=naris_ci" "NARIS_DB_PASSWORD=ci_app_0123456789abcdef0123456789abcdef0123456789abcdef" "NARIS_WEB_PORT=8081" "APP_ALLOWED_ORIGINS=http://localhost:8081" > .env.naris
          docker compose --env-file .env.naris -f docker-compose.naris.yml config -q
      - name: Build API container image
        run: docker build --target api -t naris-api:ci .
      - name: Build frontend container image
        run: docker build --target web -t naris-web:ci .
