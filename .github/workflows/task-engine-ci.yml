name: Task Engine CI

on:
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/task-engine-ci.yml"
  push:
    branches: [feat/postgres-task-engine]
    paths:
      - "server/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/task-engine-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run task-engine tests
        run: npx vitest run server/task-engine.test.ts
      - name: TypeScript check
        run: npm run lint
      - name: Frontend production build
        run: npm run build
