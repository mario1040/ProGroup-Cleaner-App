name: naris-ops

services:
  naris-postgres:
    image: postgres:17-alpine
    container_name: naris-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: naris_ops
      POSTGRES_USER: ${NARIS_DB_ADMIN_USER:?Set NARIS_DB_ADMIN_USER in .env.naris}
      POSTGRES_PASSWORD: ${NARIS_DB_ADMIN_PASSWORD:?Set NARIS_DB_ADMIN_PASSWORD in .env.naris}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - naris_ops_pg_data:/var/lib/postgresql/data
    networks:
      - naris-private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NARIS_DB_ADMIN_USER} -d naris_ops"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  naris-db-bootstrap:
    image: postgres:17-alpine
    container_name: naris-db-bootstrap
    restart: "no"
    env_file:
      - .env.naris
    volumes:
      - ./db/init-app-role.sql:/bootstrap/init-app-role.sql:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export PGPASSWORD="$NARIS_DB_ADMIN_PASSWORD"
        until pg_isready -h naris-postgres -U "$NARIS_DB_ADMIN_USER" -d naris_ops; do sleep 2; done
        psql -h naris-postgres -U "$NARIS_DB_ADMIN_USER" -d naris_ops -v ON_ERROR_STOP=1 -v app_user="$NARIS_DB_USER" -v app_password="$NARIS_DB_PASSWORD" -f /bootstrap/init-app-role.sql
    depends_on:
      naris-postgres:
        condition: service_healthy
    networks:
      - naris-private

  naris-migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: naris-migrate
    restart: "no"
    env_file:
      - .env.naris
    environment:
      DATABASE_URL: postgresql://${NARIS_DB_USER}:${NARIS_DB_PASSWORD}@naris-postgres:5432/naris_ops
      PG_SSL: "false"
    command: ["npm", "run", "db:migrate"]
    depends_on:
      naris-db-bootstrap:
        condition: service_completed_successfully
    networks:
      - naris-private

  naris-import:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: naris-import
    profiles: ["import"]
    restart: "no"
    env_file:
      - .env.naris
    environment:
      DATABASE_URL: postgresql://${NARIS_DB_USER}:${NARIS_DB_PASSWORD}@naris-postgres:5432/naris_ops
      PG_SSL: "false"
    volumes:
      - ./naris_ops_firestore_backup:/backup:ro
    command: ["npm", "run", "data:import-firestore", "--", "--dry-run", "--backup-dir", "/backup"]
    depends_on:
      naris-migrate:
        condition: service_completed_successfully
    networks:
      - naris-private

  naris-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: naris-api
    restart: unless-stopped
    env_file:
      - .env.naris
    environment:
      NODE_ENV: production
      API_PORT: 4000
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
      PG_SSL: "false"
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Africa/Cairo}
      APP_ALLOWED_ORIGINS: "${APP_ALLOWED_ORIGINS:-http://localhost:8081},https://naris-front.bezaverse.com"
      SESSION_COOKIE_SAMESITE: Lax
      TASK_GENERATION_ENABLED: ${TASK_GENERATION_ENABLED:-false}
      DATABASE_URL: postgresql://${NARIS_DB_USER}:${NARIS_DB_PASSWORD}@naris-postgres:5432/naris_ops
    depends_on:
      naris-migrate:
        condition: service_completed_successfully
    networks:
      - naris-private
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  naris-web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        VITE_API_BASE_URL: ""
        VITE_CLOUDINARY_CLOUD_NAME: ${VITE_CLOUDINARY_CLOUD_NAME:-}
        VITE_CLOUDINARY_UPLOAD_PRESET: ${VITE_CLOUDINARY_UPLOAD_PRESET:-}
    container_name: naris-web
    restart: unless-stopped
    ports:
      - "${NARIS_WEB_PORT:-8081}:80"
    depends_on:
      naris-api:
        condition: service_healthy
    networks:
      - naris-private
    security_opt:
      - no-new-privileges:true

networks:
  naris-private:
    name: naris-private
    driver: bridge

volumes:
  naris_ops_pg_data:
    name: naris_ops_pg_data
